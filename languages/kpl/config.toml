name = "KPL"
grammar = "kpl"
path_suffixes = ["k", "kpl", "h"]
first_line_pattern = "^(header\\s|--)"
line_comments = ["-- "]
tab_size = 2
hard_tabs = false

brackets = [
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
